<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test messagerie — CoRide</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 20px; }
  label { display: block; font-size: 13px; margin: 12px 0 4px; color: #444; }
  input { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; box-sizing: border-box; }
  button { margin-top: 10px; padding: 10px 16px; background: #12583f; color: white; border: none; border-radius: 5px; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #messages { margin-top: 20px; border: 1px solid #ddd; border-radius: 6px; height: 260px; overflow-y: auto; padding: 12px; background: #fafafa; }
  .msg { margin-bottom: 8px; font-size: 14px; }
  .msg b { color: #12583f; }
  #status { font-size: 12px; margin-top: 8px; }
  .connected { color: #1e7e34; }
  .disconnected { color: #c1443c; }
  .send-row { display: flex; gap: 8px; margin-top: 10px; }
  .send-row input { flex: 1; }
</style>
</head>
<body>
  <h1>Test messagerie temps réel</h1>
  <p style="font-size: 13px; color: #666;">
    Ouvre cette page dans deux onglets différents (un par utilisateur) pour voir les messages arriver en direct.
  </p>

  <label>Email</label>
  <input type="email" id="email" placeholder="test@coride.tn">
  <label>Mot de passe</label>
  <input type="password" id="password" placeholder="motdepasse123">
  <label>ID du trajet</label>
  <input type="text" id="trajetId" placeholder="Collez ici l'id du trajet">
  <button id="connect-btn">Se connecter au chat</button>

  <div id="status" class="disconnected">Non connecté</div>
  <div id="messages"></div>

  <div class="send-row">
    <input type="text" id="message-input" placeholder="Écrire un message..." disabled>
    <button id="send-btn" disabled>Envoyer</button>
  </div>

<script>
const API_BASE = 'http://localhost:4000/api';
let socket = null;
let trajetId = null;
let myUserId = null;

function addMessage(msg) {
  const el = document.getElementById('messages');
  const mine = msg.expediteurId === myUserId || (msg.expediteur && msg.expediteur.id === myUserId);
  const div = document.createElement('div');
  div.className = 'msg';
  div.innerHTML = '<b>' + (mine ? 'Moi' : msg.expediteur.nom) + ':</b> ' + msg.contenu;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

document.getElementById('connect-btn').addEventListener('click', async () => {
  // Empêche les connexions multiples si le bouton est cliqué plusieurs fois
  if (socket) {
    socket.disconnect();
    socket = null;
  }

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  trajetId = document.getElementById('trajetId').value.trim();

  try {
    const loginRes = await fetch(API_BASE + '/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password }),
    });
    const loginData = await loginRes.json();
    if (!loginRes.ok) throw new Error(loginData.error);
    myUserId = loginData.user.id;

    // Charger l'historique existant
    const histRes = await fetch(API_BASE + '/messages/' + trajetId, {
      headers: { Authorization: 'Bearer ' + loginData.token },
    });
    const histData = await histRes.json();
    if (histRes.ok) {
      document.getElementById('messages').innerHTML = '';
      histData.messages.forEach(addMessage);
    }

    // Se connecter en temps réel
    socket = io('http://localhost:4000', { auth: { token: loginData.token } });

    socket.on('connect', () => {
      document.getElementById('status').textContent = 'Connecté';
      document.getElementById('status').className = 'connected';
      socket.emit('join_trajet', { trajetId });
      document.getElementById('message-input').disabled = false;
      document.getElementById('send-btn').disabled = false;
      document.getElementById('connect-btn').disabled = true;
    });

    socket.on('new_message', addMessage);
    socket.on('error_message', (msg) => alert(msg));
    socket.on('disconnect', () => {
      document.getElementById('status').textContent = 'Déconnecté';
      document.getElementById('status').className = 'disconnected';
    });
  } catch (err) {
    alert('Erreur : ' + err.message);
  }
});

function sendMessage() {
  const input = document.getElementById('message-input');
  const contenu = input.value.trim();
  if (!contenu || !socket) return;
  socket.emit('send_message', { trajetId, contenu });
  input.value = '';
}

document.getElementById('send-btn').addEventListener('click', sendMessage);
document.getElementById('message-input').addEventListener('keyup', (e) => {
  if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
